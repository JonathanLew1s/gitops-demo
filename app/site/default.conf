resolver kube-dns.kube-system.svc.cluster.local valid=2s;

# Which backend a browser tab talks to. In production a service mesh or ingress
# does this; here the page sends X-Track so two tabs can sit on different
# versions at the same time. "auto" = everything, in proportion to pod count.
map $http_x_track $backend_svc {
  default  podinfo;
  stable   podinfo-stable;
  canary   podinfo-canary;
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Read-only window onto the backend. Only the root document is proxied,
  # so the public site can't reach podinfo's /panic or /status endpoints.
  location = /api/ {
    limit_except GET { deny all; }
    set $backend http://$backend_svc.gitops-demo.svc.cluster.local:9898;
    rewrite ^ / break;
    proxy_pass $backend;
    proxy_set_header Accept application/json;
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    # A pod that vanishes mid-request is retried on another one. With a single
    # replica there is nothing to retry on, and the page shows the outage.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    add_header Cache-Control "no-store";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html /index.html;
  }
}
