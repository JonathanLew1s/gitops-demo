resolver kube-dns.kube-system.svc.cluster.local valid=5s;

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Read-only window onto the backend. Only the root document is proxied,
  # so the public site can't reach podinfo's /panic or /status endpoints.
  location = /api/ {
    limit_except GET { deny all; }
    set $backend http://podinfo.gitops-demo.svc.cluster.local:9898;
    rewrite ^ / break;
    proxy_pass $backend;
    proxy_set_header Accept application/json;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
