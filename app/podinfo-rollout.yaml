# The backend is an Argo Rollout instead of a Deployment: same pods, but the
# upgrade is staged. 50% of the pods move to the new version, automated tests
# run against them, then a human promotes (or the tests abort and roll back).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: podinfo
  labels:
    app.kubernetes.io/name: podinfo
    app.kubernetes.io/part-of: gitops-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  strategy:
    canary:
      stableService: podinfo-stable
      canaryService: podinfo-canary
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: smoke-test
        - pause: {}          # a human looks at both versions side by side, then promotes
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podinfo
        app.kubernetes.io/part-of: gitops-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: podinfo
          # Deliberately old: patched live during the GitOps chapter.
          image: ghcr.io/stefanprodan/podinfo:6.9.4
          command:
            - ./podinfo
            - --port=9898
            - --level=info
            - --random-error=true
          env:
            - name: PODINFO_UI_COLOR
              value: "#27ae60"
            - name: PODINFO_UI_MESSAGE
              value: "v3: the release with a bug"
          ports:
            - name: http
              containerPort: 9898
              protocol: TCP   # the Rollouts controller writes this default back; declare it so Argo sees no drift
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10   # a realistic warm-up: the app is not ready for 10s after it starts
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
