# The automated tests the canary must pass before a human is even asked.
# If any check fails, Argo Rollouts aborts and traffic stays on the old version.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: smoke-test
spec:
  metrics:
    - name: canary-healthy
      interval: 4s
      count: 5
      failureLimit: 0
      consecutiveErrorLimit: 0   # any error response fails the test (the default tolerates 4 in a row)
      successCondition: result == "OK"
      provider:
        web:
          url: http://podinfo-canary.gitops-demo.svc.cluster.local:9898/healthz
          jsonPath: "{$.status}"
    - name: canary-ready
      interval: 4s
      count: 5
      failureLimit: 0
      consecutiveErrorLimit: 0   # any error response fails the test (the default tolerates 4 in a row)
      successCondition: result == "OK"
      provider:
        web:
          url: http://podinfo-canary.gitops-demo.svc.cluster.local:9898/readyz
          jsonPath: "{$.status}"
    - name: canary-serves-page
      interval: 4s
      count: 5
      failureLimit: 0
      consecutiveErrorLimit: 0   # any error response fails the test (the default tolerates 4 in a row)
      successCondition: result != ""
      provider:
        web:
          url: http://podinfo-canary.gitops-demo.svc.cluster.local:9898/
          jsonPath: "{$.version}"
